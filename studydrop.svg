
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="100%" stop-color="#58a5ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1685ff"/>
      <stop offset="100%" stop-color="#4238f5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#174c9c" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="26" fill="url(#bg)"/>
  <circle cx="820" cy="70" r="150" fill="#fff" opacity=".18"/>
  <circle cx="65" cy="430" r="140" fill="#fff" opacity=".2"/>

  <!-- Brand and title -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(52 45)">
      <path d="M0 15 L34 0 L68 15 L34 31 Z" fill="url(#blue)"/>
      <path d="M8 29 L34 41 L60 29 L60 39 L34 53 L8 39 Z" fill="#1768e8"/>
      <path d="M8 43 L34 55 L60 43 L60 53 L34 67 L8 53 Z" fill="#1647bd"/>
    </g>
    <text x="135" y="83" font-size="43" font-weight="800" fill="#10234b">Study<tspan fill="#1769ed">Drop</tspan></text>
    <text x="137" y="108" font-size="15" letter-spacing="1.5" fill="#47658e">YOUR STUDY, YOUR PRIORITY</text>

    <text x="54" y="181" font-size="35" font-weight="800" fill="#10234b">Smart Learning</text>
    <text x="54" y="222" font-size="35" font-weight="800" fill="#1769ed">Platform</text>
    <text x="56" y="253" font-size="15" fill="#365780">Your notes. Your files. All in one place.</text>
    <text x="56" y="275" font-size="15" fill="#365780">Organize and access study materials easily.</text>
  </g>

  <!-- Feature rows -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(57 310)">
      <circle cx="20" cy="20" r="20" fill="#1685ff"/>
      <path d="M12 22 L20 14 L28 22 M20 14 V29 M10 26 V31 H30 V26" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="53" y="17" font-size="16" font-weight="700" fill="#10234b">Upload Materials</text>
      <text x="53" y="37" font-size="13" fill="#47658e">Notes, PDFs and documents</text>
    </g>
    <g transform="translate(57 371)">
      <circle cx="20" cy="20" r="20" fill="#7c4dff"/>
      <path d="M8 20 Q20 6 32 20 Q20 34 8 20 Z" fill="none" stroke="#fff" stroke-width="2.5"/>
      <circle cx="20" cy="20" r="4" fill="#fff"/>
      <text x="53" y="17" font-size="16" font-weight="700" fill="#10234b">Preview &amp; Download</text>
      <text x="53" y="37" font-size="13" fill="#47658e">Access learning files with ease</text>
    </g>
  </g>

  <!-- Laptop body -->
  <g filter="url(#shadow)">
    <rect x="390" y="112" width="440" height="286" rx="18" fill="#132b51"/>
    <rect x="401" y="123" width="418" height="264" rx="10" fill="url(#screen)"/>
    <path d="M365 399 L852 399 L880 426 Q882 434 865 435 L350 435 Q337 434 343 426 Z" fill="#829fc7"/>
    <path d="M365 399 L852 399 L864 420 L355 420 Z" fill="#d9e8fc"/>
    <rect x="565" y="405" width="100" height="6" rx="3" fill="#91acd2"/>
  </g>

