    <rect x="414" y="139" width="392" height="35" rx="7" fill="#fff"/>
    <circle cx="429" cy="156" r="5" fill="#ff6578"/>
    <circle cx="444" cy="156" r="5" fill="#ffc247"/>
    <circle cx="459" cy="156" r="5" fill="#35c98b"/>
    <text x="480" y="161" font-size="13" font-weight="700" fill="#173568">StudyDrop</text>

    <rect x="414" y="180" width="91" height="196" rx="7" fill="#122e61"/>
    <rect x="423" y="195" width="73" height="27" rx="6" fill="#277bff"/>
