    <text x="428" y="244" font-size="10" fill="#d9e7ff">▤ My Files</text>
    <text x="428" y="272" font-size="10" fill="#d9e7ff">↑ Upload</text>
    <text x="428" y="300" font-size="10" fill="#d9e7ff">♡ Shared</text>
